<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d192b 100%); border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="xmlNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Decorative Background Grid -->
  <g opacity="0.08">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M60,0 V340 M120,0 V340 M180,0 V340 M240,0 V340 M300,0 V340 M360,0 V340 M420,0 V340 M480,0 V340 M540,0 V340 M600,0 V340 M660,0 V340 M720,0 V340 M780,0 V340 M840,0 V340 M900,0 V340 M960,0 V340 M1020,0 V340 M1080,0 V340 M1140,0 V340" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Dynamic / Animated Background Data Flows (Kept in Background behind texts) -->
  <g opacity="0.45">
    <!-- Flow Line 1 -->
    <path d="M 50,70 Q 300,20 600,70 T 1150,70" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,8">
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Flow Line 2 -->
    <path d="M 50,290 Q 350,330 650,280 T 1150,290" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8,10">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="14s" repeatCount="indefinite" />
    </path>

    <!-- Floating XML Elements / Pills (Positioned in corners & background) -->
    <g transform="translate(70, 45)">
      <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="65" y="18" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">&lt;xml /&gt; ETL</text>
    </g>

    <g transform="translate(1000, 45)">
      <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="65" y="18" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">&lt;xsd:schema/&gt;</text>
    </g>

    <g transform="translate(80, 270)">
      <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="70" y="18" fill="#22d3ee" font-size="12" font-weight="600" text-anchor="middle">DataWeave &amp; XSLT</text>
    </g>

    <g transform="translate(980, 270)">
      <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" opacity="0.8">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4.5s" repeatCount="indefinite" />
      </rect>
      <text x="70" y="18" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Enterprise iPaaS</text>
    </g>

    <!-- Animated Data Stream Particles -->
    <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 50,70 Q 300,20 600,70 T 1150,70" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#c084fc" filter="url(#glow)">
      <animateMotion path="M 1150,290 Q 650,280 350,330 T 50,290" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Main Title & Badges (Completely clear, unblocked, high contrast) -->
  <g id="foreground-content">
    <!-- Tagline Badge -->
    <g transform="translate(600, 78)">
      <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-150" cy="0" r="4" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="5" y="4" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" font-size="44" font-weight="800" text-anchor="middle" fill="url(#headerGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome XML Data Processing &amp; Integration
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-size="18" font-weight="400" text-anchor="middle" fill="#cbd5e1" letter-spacing="0.2">
      Enterprise iPaaS Solutions • Cloud ETL Pipelines • Schema Validators • High-Speed Parsers
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 235)">
      <!-- Pill 1: Enterprise iPaaS -->
      <g transform="translate(-310, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="72" y="19" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">⚡ Enterprise iPaaS</text>
      </g>
      <!-- Pill 2: Open Source Libraries -->
      <g transform="translate(-150, 0)">
        <rect x="0" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="82" y="19" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">🌿 Open Source Engines</text>
      </g>
      <!-- Pill 3: XSLT / XPath / XSD -->
      <g transform="translate(30, 0)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="67" y="19" fill="#fde68a" font-size="12" font-weight="600" text-anchor="middle">🛠️ XSLT &amp; XSD Tools</text>
      </g>
      <!-- Pill 4: Zero-Alloc Binding -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
        <text x="70" y="19" fill="#fbcfe8" font-size="12" font-weight="600" text-anchor="middle">🚀 Native Bindings</text>
      </g>
    </g>
  </g>
</svg>
